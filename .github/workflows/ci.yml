name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: git ls-files --error-unmatch cli/whydone.mjs && git diff --exit-code -- cli   # vendored plugin CLI must be tracked AND rebuilt+committed together
        shell: bash
      - run: npm test
      - run: node scripts/check-versions.mjs
      - run: node dist/cli.js validate .whydone   # dogfood journal stays schema-clean
      - run: node dist/cli.js recall --json --limit 3   # smoke: built CLI runs end-to-end
